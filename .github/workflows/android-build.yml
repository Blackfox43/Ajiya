name: AJIYA Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AJIYA APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Gradle Wrapper
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la

          echo "===== GRADLE WRAPPER ====="
          ls -la gradle/wrapper

          echo "===== WRAPPER PROPERTIES ====="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Create Debug Keystore
        run: |
          echo "Creating debug keystore..."

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created successfully:"
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

      - name: Verify Debug Keystore
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Locate APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload AJIYA APK
        uses: actions/upload-artifact@v4
        with:
          name: AJIYA-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
